definitions:
  db.Payment:
    properties:
      amount:
        format: int64
        type: integer
      id:
        type: string
      status:
        $ref: '#/definitions/db.PaymentStatus'
      userID:
        type: string
    type: object
  db.PaymentStatus:
    enum:
    - pending
    - success
    - failure
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusSuccess
    - PaymentStatusFailure
  handler.PaymentRequest:
    properties:
      amount:
        example: 1000
        type: integer
      userId:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - amount
    - userId
    type: object
info:
  contact: {}
paths:
  /payment:
    post:
      consumes:
      - application/json
      description: Регистрирует платёж и отправляет его на обработку
      parameters:
      - description: Данные платежа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PaymentRequest'
      produces:
      - application/json
      responses: {}
      summary: Совершить платёж
      tags:
      - Payment
  /payment/{id}:
    get:
      parameters:
      - description: Идентификатор платежа (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Payment'
      summary: Получить данные о платёже
      tags:
      - Payment
swagger: "2.0"
